services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pgconnect
      POSTGRES_USER: pgconnect
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localpassword}
    ports:
      - "5432:5432"
    volumes:
      - pgconnect-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgconnect -d pgconnect"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgconnect-data:
